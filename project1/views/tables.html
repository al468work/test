<div class="app-content-header">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Таблицы данных</h3>
    <!-- Кнопка принудительного обновления данных -->
    <button id="reloadDataBtn" class="btn btn-sm btn-outline-primary">Обновить данные</button>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title">Список пользователей</h3>
        <input type="text" id="tableSearch" class="form-control form-control-sm w-auto" placeholder="Поиск...">
      </div>
      <div class="card-body p-0">
        <table class="table table-striped" id="usersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Имя</th>
              <th>Роль</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Сюда скрипт подставит строки -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  {
    const tbody = document.getElementById('usersTableBody');
    const searchInput = document.getElementById('tableSearch');
    const reloadBtn = document.getElementById('reloadDataBtn');

    // Функция загрузки и отрисовки данных
    async function loadTableData() {
      // 1. Показываем индикатор загрузки
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Загрузка данных...
          </td>
        </tr>
      `;

      try {
        // 2. Запрашиваем данные (укажите путь к вашему JSON или URL внешнего API)
        // Параметр ?t=... защищает от кэширования старых данных браузером
        const response = await fetch(`data/users.json?t=${Date.now()}`);
        
        if (!response.ok) {
          throw new Error(`Ошибка сервера: ${response.status}`);
        }

        const users = await response.json();

        // 3. Если список пуст
        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">Нет данных для отображения</td></tr>';
          return;
        }

        // 4. Отрисовываем строки таблицы
        tbody.innerHTML = users.map(user => `
          <tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.role}</td>
            <td><span class="badge ${user.badge || 'text-bg-secondary'}">${user.status}</span></td>
          </tr>
        `).join('');

      } catch (error) {
        // 5. Выводим сообщение при ошибке сети или отсутствии файла
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center py-4 text-danger">
              Не удалось загрузить данные: ${error.message}
            </td>
          </tr>
        `;
      }
    }

    // Фильтрация уже загруженных строк при вводе в поиск
    searchInput.addEventListener('input', function () {
      const query = this.value.toLowerCase();
      const rows = tbody.querySelectorAll('tr');
      rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    });

    // Повторная загрузка по кнопке "Обновить данные"
    reloadBtn.addEventListener('click', loadTableData);

    // АВТОЗАПУСК: вызываем загрузку сразу при открытии этой вьюхи
    loadTableData();
  }
</script>
