<div class="app-content-header">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Таблицы данных</h3>
    <div class="d-flex align-items-center gap-2">
      <span id="dataStatusBadge" class="badge text-bg-secondary">Ожидание...</span>
      <button id="reloadDataBtn" class="btn btn-sm btn-outline-primary">Обновить</button>
    </div>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="card">
      <!-- Шапка карточки -->
      <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
          <h3 class="card-title mb-0">Справочник данных</h3>
          
          <!-- Панель появляется, когда выбрана строка -->
          <div id="rowActions" class="d-none align-items-center gap-2">
            <span class="badge text-bg-primary" id="selectedInfo">Выбрано: ID 1</span>
            <button type="button" id="deleteSelectedBtn" class="btn btn-xs btn-danger">Удалить</button>
          </div>
        </div>

        <input type="text" id="tableSearch" class="form-control form-control-sm w-auto" placeholder="Поиск по таблице...">
      </div>

      <!-- Тело таблицы -->
      <div class="card-body p-0 table-responsive">
        <table class="table table-hover align-middle mb-0" id="usersTable">
          <thead class="table-light">
            <tr>
              <th style="width: 60px;">ID</th>
              <th>Наименование</th>
              <th>Значение</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Сюда скрипт подставит строки -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  {
    // Берем данные из локального файла вашего проекта
    const DATA_URL = 'data/users.json';
    const LOCAL_STORAGE_KEY = 'cached_table_records';

    const tbody = document.getElementById('usersTableBody');
    const searchInput = document.getElementById('tableSearch');
    const reloadBtn = document.getElementById('reloadDataBtn');
    const rowActions = document.getElementById('rowActions');
    const selectedInfo = document.getElementById('selectedInfo');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const dataStatusBadge = document.getElementById('dataStatusBadge');

    function updateSelectionUI() {
      const selectedRow = tbody.querySelector('tr.table-primary');
      if (selectedRow && selectedRow.style.display !== 'none') {
        selectedInfo.textContent = `Выбрано: ${selectedRow.dataset.name} (ID: ${selectedRow.dataset.id})`;
        rowActions.classList.remove('d-none');
        rowActions.classList.add('d-flex');
      } else {
        rowActions.classList.add('d-none');
        rowActions.classList.remove('d-flex');
      }
    }

    function renderRows(items) {
      if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Нет данных для отображения</td></tr>';
        updateSelectionUI();
        return;
      }

      tbody.innerHTML = items.map(item => `
        <tr data-id="${item.id}" data-name="${item.name}" style="cursor: pointer; user-select: none;">
          <td>${item.id}</td>
          <td>${item.name}</td>
          <td>${item.value}</td>
          <td><span class="badge text-bg-success">${item.status}</span></td>
        </tr>
      `).join('');

      updateSelectionUI();
    }

    async function loadTableData() {
      dataStatusBadge.className = 'badge text-bg-secondary';
      dataStatusBadge.textContent = 'Загрузка...';

      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Загрузка данных...
          </td>
        </tr>
      `;

      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ошибка ${response.status}`);
        
        const items = await response.json();
        
        // Сохраняем свежие данные в localStorage телефона
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(items));
        
        dataStatusBadge.className = 'badge text-bg-success';
        dataStatusBadge.textContent = navigator.onLine ? 'Из проекта (актуально)' : 'Из кэша (офлайн)';
        renderRows(items);

      } catch (error) {
        const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (savedData) {
          dataStatusBadge.className = 'badge text-bg-warning';
          dataStatusBadge.textContent = 'Офлайн (из памяти)';
          renderRows(JSON.parse(savedData));
        } else {
          dataStatusBadge.className = 'badge text-bg-danger';
          dataStatusBadge.textContent = 'Ошибка загрузки';
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="text-center py-4 text-danger">
                <strong>Не удалось загрузить файл data/users.json:</strong> ${error.message}
              </td>
            </tr>
          `;
        }
      }
    }

    // Одиночный выбор строки по клику с подсветкой
    tbody.addEventListener('click', (event) => {
      const clickedRow = event.target.closest('tr');
      if (!clickedRow || !clickedRow.dataset.id) return;

      const isAlreadySelected = clickedRow.classList.contains('table-primary');
      tbody.querySelectorAll('tr').forEach(row => row.classList.remove('table-primary'));
      if (!isAlreadySelected) {
        clickedRow.classList.add('table-primary');
      }
      updateSelectionUI();
    });

    // Удаление выбранной строки
    deleteSelectedBtn.addEventListener('click', () => {
      const selectedRow = tbody.querySelector('tr.table-primary');
      if (selectedRow) {
        selectedRow.remove();
        updateSelectionUI();
      }
    });

    // Живой поиск по таблице
    searchInput.addEventListener('input', function () {
      const query = this.value.toLowerCase();
      tbody.querySelectorAll('tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
      updateSelectionUI();
    });

    reloadBtn.addEventListener('click', loadTableData);
    loadTableData();
  }
</script>
