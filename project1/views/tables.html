<div class="app-content-header">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Таблицы данных</h3>
    <button id="reloadDataBtn" class="btn btn-sm btn-outline-primary">Обновить данные</button>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="card">
      <!-- Шапка карточки -->
      <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
          <h3 class="card-title mb-0">Список пользователей</h3>
          
          <!-- Панель появляется, когда выбрана строка -->
          <div id="rowActions" class="d-none align-items-center gap-2">
            <span class="badge text-bg-primary" id="selectedInfo">Выбрано: ID 1</span>
            <button type="button" id="deleteSelectedBtn" class="btn btn-xs btn-danger">Удалить</button>
          </div>
        </div>

        <input type="text" id="tableSearch" class="form-control form-control-sm w-auto" placeholder="Поиск по таблице...">
      </div>

      <!-- Тело таблицы -->
      <div class="card-body p-0 table-responsive">
        <table class="table table-hover align-middle mb-0" id="usersTable">
          <thead class="table-light">
            <tr>
              <th style="width: 60px;">ID</th>
              <th>Имя</th>
              <th>Роль</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Сюда скрипт подставит строки -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  {
    const tbody = document.getElementById('usersTableBody');
    const searchInput = document.getElementById('tableSearch');
    const reloadBtn = document.getElementById('reloadDataBtn');
    const rowActions = document.getElementById('rowActions');
    const selectedInfo = document.getElementById('selectedInfo');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');

    // Обновление панели действий в зависимости от выбранной строки
    function updateSelectionUI() {
      const selectedRow = tbody.querySelector('tr.table-primary');
      
      if (selectedRow && selectedRow.style.display !== 'none') {
        const id = selectedRow.dataset.id;
        const name = selectedRow.dataset.name;
        selectedInfo.textContent = `Выбрано: ${name} (ID: ${id})`;
        rowActions.classList.remove('d-none');
        rowActions.classList.add('d-flex');
      } else {
        rowActions.classList.add('d-none');
        rowActions.classList.remove('d-flex');
      }
    }

    // Отрисовка строк
    function renderRows(users) {
      if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Нет данных для отображения</td></tr>';
        updateSelectionUI();
        return;
      }

      tbody.innerHTML = users.map(user => `
        <tr data-id="${user.id}" data-name="${user.name}" style="cursor: pointer; user-select: none;">
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.role}</td>
          <td><span class="badge ${user.badge || 'text-bg-secondary'}">${user.status}</span></td>
        </tr>
      `).join('');

      updateSelectionUI();
    }

    // Загрузка данных (чистый путь для работы из кэша без интернета)
    async function loadTableData() {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Загрузка данных...
          </td>
        </tr>
      `;

      try {
        const response = await fetch('data/users.json');
        if (!response.ok) throw new Error('Файл не найден');
        const users = await response.json();
        renderRows(users);
      } catch (error) {
        // Резервные данные, если файл data/users.json не создан или недоступен
        renderRows([
          { id: 1, name: 'Иван Иванов', role: 'Администратор', status: 'Активен', badge: 'text-bg-success' },
          { id: 2, name: 'Анна Смирнова', role: 'Менеджер', status: 'Ожидает', badge: 'text-bg-warning' },
          { id: 3, name: 'Петр Сидоров', role: 'Пользователь', status: 'Заблокирован', badge: 'text-bg-danger' },
          { id: 4, name: 'Елена Козлова', role: 'Редактор', status: 'Активен', badge: 'text-bg-success' }
        ]);
      }
    }

    // Клик по строке (одиночный выбор)
    tbody.addEventListener('click', (event) => {
      const clickedRow = event.target.closest('tr');
      if (!clickedRow || !clickedRow.dataset.id) return;

      const isAlreadySelected = clickedRow.classList.contains('table-primary');

      tbody.querySelectorAll('tr').forEach(row => row.classList.remove('table-primary'));

      if (!isAlreadySelected) {
        clickedRow.classList.add('table-primary');
      }

      updateSelectionUI();
    });

    // Действие с выбранной строкой
    deleteSelectedBtn.addEventListener('click', () => {
      const selectedRow = tbody.querySelector('tr.table-primary');
      if (selectedRow) {
        console.log('Удаляем запись с ID:', selectedRow.dataset.id);
        selectedRow.remove();
        updateSelectionUI();
      }
    });

    // Поиск по таблице
    searchInput.addEventListener('input', function () {
      const query = this.value.toLowerCase();
      tbody.querySelectorAll('tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
      updateSelectionUI();
    });

    reloadBtn.addEventListener('click', loadTableData);
    loadTableData();
  }
</script>
