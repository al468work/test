<div class="app-content-header">
  <div class="container-fluid">
    <h3 class="mb-0">Обзор</h3>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div id="dashError" class="d-none alert alert-danger"></div>

    <div class="row">
      <div class="col-lg-3 col-6">
        <div class="small-box text-bg-primary">
          <div class="inner">
            <h3 id="dashTime">--:--:--</h3>
            <p id="dashDate">—</p>
          </div>
          <div class="small-box-icon">🕒</div>
        </div>
      </div>
      <div class="col-lg-3 col-6">
        <div class="small-box text-bg-success">
          <div class="inner">
            <h3 id="dashTask">—</h3>
            <p>Текущий канал</p>
          </div>
          <div class="small-box-icon">💧</div>
        </div>
      </div>
      <div class="col-lg-3 col-6">
        <div class="small-box text-bg-warning">
          <div class="inner">
            <h3 id="dashPower">—</h3>
            <p>Суммарная мощность INA</p>
          </div>
          <div class="small-box-icon">⚡</div>
        </div>
      </div>
      <div class="col-lg-3 col-6">
        <div class="small-box text-bg-info">
          <div class="inner">
            <h3 id="dashChannels">—</h3>
            <p>Активных каналов</p>
          </div>
          <div class="small-box-icon">🔧</div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-header"><h3 class="card-title">Текущее задание</h3></div>
          <div class="card-body" id="dashTaskBody">
            <span class="text-muted">Загрузка...</span>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-header"><h3 class="card-title">Показания INA3221</h3></div>
          <div class="card-body p-0">
            <table class="table table-sm table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Канал</th>
                  <th>Напряжение</th>
                  <th>Ток</th>
                  <th>Мощность</th>
                  <th>Статус</th>
                </tr>
              </thead>
              <tbody id="dashInaBody">
                <tr><td colspan="5" class="text-center text-muted py-3">Загрузка...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (async function () {
    const DS = window.DataSource;
    const $ = (id) => document.getElementById(id);
    const esc = DS.escapeHtml;

    try {
      const [rtc, week, channels, ina] = await Promise.all([
        DS.getRtc(), DS.getWeek(), DS.getChannels(), DS.getIna()
      ]);

      // Часы: идут от тестового времени из data/rtc.json
      let dt = new Date(rtc.year, rtc.month - 1, rtc.day, rtc.hour, rtc.minute, rtc.second);
      function tick() {
        $('dashTime').textContent = dt.toLocaleTimeString('ru-RU', { hour12: false });
        $('dashDate').textContent = DS.formatDate(rtc) + ' · ' + DS.dayName(rtc.dayOfTheWeek);
      }
      tick();
      const timer = setInterval(() => { dt = new Date(dt.getTime() + 1000); tick(); }, 1000);
      window.__viewCleanup = () => clearInterval(timer);

      // Текущее задание
      const task = DS.currentTask(rtc, week, channels);
      const taskBody = $('dashTaskBody');
      if (!task) {
        $('dashTask').textContent = '—';
        taskBody.innerHTML = '<div class="text-muted">Сейчас активного задания нет.</div>';
      } else {
        $('dashTask').textContent = 'К' + task.channel;
        const color = DS.channelColor(task.channel);
        taskBody.innerHTML = `
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="badge" style="background:${color}">Канал ${task.channel}</span>
            <span class="fs-5">${esc(task.name)}</span>
          </div>
          <dl class="row mb-0">
            <dt class="col-sm-4">MAC</dt><dd class="col-sm-8"><code>${esc(task.mac)}</code></dd>
            <dt class="col-sm-4">Клапан</dt><dd class="col-sm-8">${task.valve || '—'}</dd>
            <dt class="col-sm-4">Длительность</dt><dd class="col-sm-8">${task.duration} мин</dd>
            <dt class="col-sm-4">Канал включён</dt><dd class="col-sm-8">${task.channelEnabled ? 'да' : 'нет'}</dd>
          </dl>`;
      }

      // INA
      const cfg = ina.config || { channels: [] };
      let total = 0;
      cfg.channels.forEach((ch) => { total += Number(ch.power) || 0; });
      $('dashPower').textContent = total.toFixed(2) + ' Вт';

      const regEnabled = Object.values(channels).filter((c) => c.enabled).length;
      $('dashChannels').textContent = regEnabled + ' / 16';

      $('dashInaBody').innerHTML = cfg.channels.map((ch, i) => `
        <tr>
          <td>Канал ${i + 1}</td>
          <td>${(Number(ch.voltage) || 0).toFixed(2)} В</td>
          <td>${(Number(ch.current) || 0).toFixed(2)} А</td>
          <td>${(Number(ch.power) || 0).toFixed(2)} Вт</td>
          <td>${ch.enabled ? '<span class="badge text-bg-success">вкл</span>' : '<span class="badge text-bg-secondary">выкл</span>'}</td>
        </tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted py-3">Нет данных</td></tr>';
    } catch (e) {
      const box = $('dashError');
      box.classList.remove('d-none');
      box.textContent = 'Ошибка загрузки данных: ' + e.message;
    }
  })();
</script>
