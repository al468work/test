<div class="app-content-header">
  <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h3 class="mb-0">Реестр каналов</h3>
    <div class="d-flex align-items-center gap-2">
      <input type="text" id="chSearch" class="form-control form-control-sm w-auto" placeholder="Поиск: имя, MAC, клапан...">
      <select id="chFilter" class="form-select form-select-sm w-auto">
        <option value="all">Все</option>
        <option value="on">Включённые</option>
        <option value="off">Выключенные</option>
      </select>
    </div>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div id="chError" class="d-none alert alert-danger"></div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title mb-0">16 слотов</h3>
        <span id="chCount" class="badge text-bg-secondary">—</span>
      </div>
      <div class="card-body p-0 table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:70px;">ID</th>
              <th>Название</th>
              <th>MAC-адрес</th>
              <th>Клапан</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="chBody">
            <tr><td colspan="5" class="text-center text-muted py-4">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  (async function () {
    const DS = window.DataSource;
    const esc = DS.escapeHtml;

    const tbody = document.getElementById('chBody');
    const searchInput = document.getElementById('chSearch');
    const filterSelect = document.getElementById('chFilter');
    const countBadge = document.getElementById('chCount');

    try {
      const channels = await DS.getChannels();
      const ids = Object.keys(channels).map(Number).sort((a, b) => a - b);

      function render() {
        const query = searchInput.value.trim().toLowerCase();
        const mode = filterSelect.value;

        const rows = ids.map((id) => ({ id, ch: channels[String(id)] })).filter(({ id, ch }) => {
          if (!ch) return false;
          if (mode === 'on' && !ch.enabled) return false;
          if (mode === 'off' && ch.enabled) return false;
          if (query) {
            const haystack = `${id} ${ch.name} ${ch.mac} ${ch.valve}`.toLowerCase();
            if (!haystack.includes(query)) return false;
          }
          return true;
        });

        countBadge.textContent = `Показано: ${rows.length} / ${ids.length}`;

        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Нет совпадений</td></tr>';
          return;
        }

        tbody.innerHTML = rows.map(({ id, ch }) => {
          const color = DS.channelColor(id);
          const status = ch.enabled
            ? '<span class="badge text-bg-success">включён</span>'
            : '<span class="badge text-bg-secondary">выключен</span>';
          const mac = ch.mac === '00:00:00:00:00:00'
            ? `<code class="text-muted">${esc(ch.mac)}</code>`
            : `<code>${esc(ch.mac)}</code>`;
          return `
            <tr>
              <td><span class="legend-swatch me-1" style="background:${color}"></span>${id}</td>
              <td>${esc(ch.name)}</td>
              <td>${mac}</td>
              <td>${ch.valve || '—'}</td>
              <td>${status}</td>
            </tr>`;
        }).join('');
      }

      searchInput.addEventListener('input', render);
      filterSelect.addEventListener('change', render);
      render();
    } catch (e) {
      const box = document.getElementById('chError');
      box.classList.remove('d-none');
      box.textContent = 'Ошибка загрузки данных: ' + e.message;
    }
  })();
</script>
