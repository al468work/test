<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таблицы | Моя Админка</title>
    <link rel="stylesheet" href="css/adminlte.min.css" />
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <!-- Верхняя шапка -->
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">☰</a>
            </li>
            <li class="nav-item d-none d-md-block">
              <a href="index.html" class="nav-link">Главная</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Боковое меню -->
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="index.html" class="brand-link">
            <span class="brand-text fw-light">Моя Админка</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
              <li class="nav-item">
                <a href="index.html" class="nav-link">
                  <p>Дашборд</p>
                </a>
              </li>
              <li class="nav-item">
                <!-- Теперь класс active здесь -->
                <a href="tables.html" class="nav-link active">
                  <p>Таблицы</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="settings.html" class="nav-link">
                  <p>Настройки</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Уникальный контент страницы -->
      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid"><h3 class="mb-0">Таблицы данных</h3></div>
        </div>
        <div class="app-content">
          <div class="container-fluid">
            <div class="card">
              <div class="card-header"><h3 class="card-title">Список пользователей</h3></div>
              <div class="card-body p-0">
                <table class="table table-striped">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Имя</th>
                      <th>Статус</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr><td>1</td><td>Иван Иванов</td><td><span class="badge text-bg-success">Активен</span></td></tr>
                    <tr><td>2</td><td>Анна Смирнова</td><td><span class="badge text-bg-warning">Ожидает</span></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Подвал -->
      <footer class="app-footer">
        <strong>AdminLTE 4</strong> на GitHub Pages.
      </footer>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/adminlte.min.js"></script>
  </body>
</html>
