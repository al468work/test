<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель | master</title>

    <!-- Настройки PWA для Android -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#343a40" />
    <link rel="apple-touch-icon" href="assets/img/AdminLTELogo.png" />

    <!-- Локальные стили AdminLTE + собственные стили админки -->
    <link rel="stylesheet" href="css/adminlte.min.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <!-- Верхняя шапка -->
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">☰</a>
            </li>
            <li class="nav-item d-none d-md-block">
              <span class="nav-link text-muted">Панель управления</span>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <span class="nav-link">
                <span class="badge text-bg-warning" title="Источник данных — тестовые JSON">демо-данные</span>
              </span>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Боковое меню -->
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="#dashboard" class="brand-link">
            <span class="brand-text fw-light">Моя Админка</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" role="menu">
              <li class="nav-item">
                <a href="#dashboard" class="nav-link"><p>Обзор</p></a>
              </li>
              <li class="nav-item">
                <a href="#week" class="nav-link"><p>Расписание</p></a>
              </li>
              <li class="nav-item">
                <a href="#channels" class="nav-link"><p>Каналы</p></a>
              </li>
              <li class="nav-item">
                <a href="#ina" class="nav-link"><p>INA</p></a>
              </li>
              <li class="nav-item">
                <a href="#rtc" class="nav-link"><p>Время</p></a>
              </li>
              <li class="nav-item">
                <a href="#settings" class="nav-link"><p>Настройки</p></a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Центральная часть (сюда подгружаются вьюхи) -->
      <main class="app-main" id="main-content">
        <div class="p-4 text-muted">Загрузка раздела...</div>
      </main>

      <!-- Подвал -->
      <footer class="app-footer">
        <strong>Админ-панель master</strong> · демонстрационные данные
      </footer>
    </div>

    <!-- Локальные скрипты Bootstrap и AdminLTE -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/adminlte.min.js"></script>

    <!-- Слой доступа к данным (пока читает тестовые JSON) -->
    <script src="js/data-source.js"></script>

    <!-- Скрипт роутинга и запуска JS внутри подгружаемых страниц -->
    <script>
      const mainContent = document.getElementById('main-content');
      const menuLinks = document.querySelectorAll('.sidebar-menu .nav-link');
      const ROUTES = ['dashboard', 'week', 'channels', 'ina', 'rtc', 'settings'];

      // Принудительный запуск тегов <script> внутри загруженного HTML.
      // Нужен, потому что innerHTML не исполняет скрипты автоматически.
      function executeScripts(container) {
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
          });
          if (!oldScript.hasAttribute('src')) {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      }

      // Снимаем таймеры предыдущей вьюхи, чтобы не копить утечки.
      function runCleanup() {
        if (typeof window.__viewCleanup === 'function') {
          try { window.__viewCleanup(); } catch (e) { console.warn('viewCleanup:', e); }
        }
        window.__viewCleanup = null;
      }

      // Загрузка HTML-фрагмента и подсветка активного пункта меню
      async function loadView(viewName) {
        const page = ROUTES.includes(viewName) ? viewName : 'dashboard';

        menuLinks.forEach(link => {
          const linkHash = link.getAttribute('href').replace('#', '');
          link.classList.toggle('active', linkHash === page);
        });

        runCleanup();
        mainContent.innerHTML = '<div class="p-4 text-muted">Загрузка раздела...</div>';

        try {
          // Относительный путь без ?t=..., чтобы корректно работал офлайн-кэш
          const response = await fetch(`views/${page}.html`);
          if (!response.ok) throw new Error(`Файл views/${page}.html не найден (${response.status})`);

          mainContent.innerHTML = await response.text();
          executeScripts(mainContent);
          if (typeof window.syncStickyOffsets === 'function') window.syncStickyOffsets();
        } catch (error) {
          mainContent.innerHTML = `<div class="p-4 text-danger">Ошибка: ${error.message}</div>`;
        }
      }

      function getCurrentRoute() {
        return window.location.hash.replace('#', '');
      }

      window.addEventListener('hashchange', () => loadView(getCurrentRoute()));
      window.addEventListener('DOMContentLoaded', () => loadView(getCurrentRoute()));
    </script>

    <!-- Смещения «липких» шапки, заголовка раздела и заголовков таблиц -->
    <script>
      (function () {
        const root = document.documentElement;

        // Пересчитывает высоты и выставляет CSS-переменные:
        //   --app-header-height — смещение заголовка раздела;
        //   --app-table-top     — смещение заголовков таблиц (шапка + заголовок).
        function syncStickyOffsets() {
          const header = document.querySelector('.app-header');
          const contentHeader = document.querySelector('.app-main .app-content-header');
          const headerHeight = header ? header.offsetHeight : 0;
          const contentHeaderHeight = contentHeader ? contentHeader.offsetHeight : 0;

          root.style.setProperty('--app-header-height', headerHeight + 'px');
          root.style.setProperty('--app-table-top', (headerHeight + contentHeaderHeight) + 'px');
        }

        window.syncStickyOffsets = syncStickyOffsets;
        window.addEventListener('resize', syncStickyOffsets);
        window.addEventListener('orientationchange', syncStickyOffsets);
        window.addEventListener('load', syncStickyOffsets);
        syncStickyOffsets();
      })();
    </script>

    <!-- Регистрация Service Worker для автономной работы (офлайн) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('Офлайн-режим (Service Worker) активирован'))
            .catch(err => console.error('Ошибка Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
