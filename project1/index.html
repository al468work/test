<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель | AdminLTE 4</title>
    <link rel="stylesheet" href="css/adminlte.min.css" />
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <!-- Верхняя шапка -->
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">☰</a>
            </li>
            <li class="nav-item d-none d-md-block">
              <span class="nav-link text-muted">Панель управления</span>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Боковое меню -->
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="#" data-view="views/dashboard.html" class="brand-link">
            <span class="brand-text fw-light">Моя Админка</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" role="menu">
              <li class="nav-item">
                <!-- Указываем путь к фрагменту в data-view -->
                <a href="#" data-view="views/dashboard.html" class="nav-link active">
                  <p>Дашборд</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" data-view="views/tables.html" class="nav-link">
                  <p>Таблицы</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" data-view="views/settings.html" class="nav-link">
                  <p>Настройки</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Центральная часть (сюда JS будет подгружать страницы) -->
      <main class="app-main" id="main-content"></main>

      <!-- Подвал -->
      <footer class="app-footer">
        <strong>AdminLTE 4</strong> на GitHub Pages.
      </footer>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/adminlte.min.js"></script>

    <!-- Скрипт динамической подгрузки контента -->
    <script>
      const mainContent = document.getElementById('main-content');
      const menuLinks = document.querySelectorAll('.sidebar-menu .nav-link[data-view]');

      // Функция загрузки HTML-фрагмента
      async function loadView(url) {
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('Файл не найден: ' + url);
          const html = await response.text();
          mainContent.innerHTML = html;
        } catch (error) {
          mainContent.innerHTML = `<div class="p-4 text-danger">Ошибка загрузки: ${error.message}</div>`;
        }
      }

      // Обработка кликов по пунктам меню
      menuLinks.forEach(link => {
        link.addEventListener('click', (event) => {
          event.preventDefault(); // Отменяем стандартный переход по ссылке

          // Переключаем подсветку активного пункта меню
          menuLinks.forEach(item => item.classList.remove('active'));
          link.classList.add('active');

          // Загружаем выбранную страницу
          const viewUrl = link.getAttribute('data-view');
          loadView(viewUrl);
        });
      });

      // Загружаем главную страницу сразу при открытии сайта
      loadView('views/dashboard.html');
    </script>
  </body>
</html>
