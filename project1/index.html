<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель | AdminLTE 4</title>
    <!-- Шрифт и иконки Bootstrap -->
    <link rel="stylesheet" href="https://jsdelivr.net" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://jsdelivr.net" crossorigin="anonymous" />
    <!-- Ваши локальные стили AdminLTE из папки dist/css/ -->
    <link rel="stylesheet" href="css/adminlte.min.css" />
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <!-- Верхняя шапка -->
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                <i class="bi bi-list"></i>
              </a>
            </li>
            <li class="nav-item d-none d-md-block"><a href="#" class="nav-link">Главная</a></li>
          </ul>
        </div>
      </nav>

      <!-- Боковое меню -->
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="index.html" class="brand-link">
            <span class="brand-text fw-light">Моя Админка</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
              <li class="nav-item">
                <a href="index.html" class="nav-link active">
                  <i class="nav-icon bi bi-speedometer"></i>
                  <p>Дашборд</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <i class="nav-icon bi bi-table"></i>
                  <p>Таблицы</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Основной контент -->
      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <h3 class="mb-0">Главный дашборд</h3>
          </div>
        </div>
        <div class="app-content">
          <div class="container-fluid">
            <div class="row">
              <div class="col-lg-4 col-6">
                <div class="small-box text-bg-primary">
                  <div class="inner">
                    <h3>150</h3>
                    <p>Новых заказов</p>
                  </div>
                  <a href="#" class="small-box-footer link-light">Подробнее <i class="bi bi-arrow-right-circle"></i></a>
                </div>
              </div>
              <div class="col-lg-4 col-6">
                <div class="small-box text-bg-success">
                  <div class="inner">
                    <h3>53%</h3>
                    <p>Рост показателей</p>
                  </div>
                  <a href="#" class="small-box-footer link-light">Подробнее <i class="bi bi-arrow-right-circle"></i></a>
                </div>
              </div>
              <div class="col-lg-4 col-6">
                <div class="small-box text-bg-warning">
                  <div class="inner">
                    <h3>44</h3>
                    <p>Регистрации</p>
                  </div>
                  <a href="#" class="small-box-footer link-dark">Подробнее <i class="bi bi-arrow-right-circle"></i></a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Подвал -->
      <footer class="app-footer">
        <strong>AdminLTE 4</strong> на GitHub Pages.
      </footer>
    </div>

    <!-- Скрипты Bootstrap и локальный AdminLTE из папки dist/js/ -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="js/adminlte.min.js"></script>
  </body>
</html>
