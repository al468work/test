    <!-- Скрипт подгрузки с запоминанием раздела и запуском JS внутри вьюх -->
    <script>
      const mainContent = document.getElementById('main-content');
      const menuLinks = document.querySelectorAll('.sidebar-menu .nav-link');

      // Функция для принудительного запуска <script> внутри вставленного HTML
      function executeScripts(container) {
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          // Копируем атрибуты (например, src), если они есть
          Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
          });
          // Копируем сам JS-код
          newScript.textContent = oldScript.textContent;
          // Заменяем старый неактивный тег на новый рабочий
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      }

      // Загрузка HTML-фрагмента и обновление меню
      async function loadView(viewName) {
        const page = viewName || 'dashboard';

        // Подсвечиваем активный пункт в меню
        menuLinks.forEach(link => {
          const linkHash = link.getAttribute('href').replace('#', '');
          link.classList.toggle('active', linkHash === page);
        });

        try {
          const response = await fetch(`views/${page}.html`);
          if (!response.ok) throw new Error(`Страница views/${page}.html не найдена`);
          
          // 1. Вставляем HTML
          mainContent.innerHTML = await response.text();
          
          // 2. Запускаем все скрипты, которые были внутри этого файла
          executeScripts(mainContent);
        } catch (error) {
          mainContent.innerHTML = `<div class="p-4 text-danger">Ошибка: ${error.message}</div>`;
        }
      }

      function getCurrentRoute() {
        return window.location.hash.replace('#', '');
      }

      window.addEventListener('hashchange', () => loadView(getCurrentRoute()));
      window.addEventListener('DOMContentLoaded', () => loadView(getCurrentRoute()));
    </script>
